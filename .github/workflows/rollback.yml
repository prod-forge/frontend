name: Rollback Frontend

on:
  workflow_dispatch:
    inputs:
      version:
        description: 'Version to rollback to (e.g. v1.0.0)'
        required: true
        type: string

env:
  AWS_REGION: eu-central-1

permissions:
  id-token: write
  contents: read

jobs:
  rollback:
    runs-on: ubuntu-latest
    environment: prod

    steps:
      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v6
        with:
          role-to-assume: ${{ vars.AWS_DEPLOY_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Validate version
        env:
          VERSION: ${{ inputs.version }}
        run: |
          if [[ ! "$VERSION" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "Invalid version: $VERSION (expected vX.Y.Z)"
            exit 1
          fi

      - name: Verify version exists
        env:
          BUCKET: ${{ vars.S3_WEB_CLIENT_BUCKET }}
          VERSION: ${{ inputs.version }}
        run: |
          aws s3 ls "s3://$BUCKET/releases/$VERSION/" || \
            (echo "Version $VERSION not found in releases" && exit 1)

      - name: Restore version from archive
        env:
          BUCKET: ${{ vars.S3_WEB_CLIENT_BUCKET }}
          VERSION: ${{ inputs.version }}
        run: |
          aws s3 sync \
            "s3://$BUCKET/releases/$VERSION/" \
            "s3://$BUCKET/" \
            --exclude "releases/*" \
            --delete \
            --cache-control "max-age=31536000,immutable"
          aws s3 cp \
            "s3://$BUCKET/releases/$VERSION/index.html" \
            "s3://$BUCKET/index.html" \
            --cache-control "no-cache, no-store, must-revalidate"

      - name: Invalidate CloudFront
        env:
          DISTRIBUTION_ID: ${{ vars.CLOUDFRONT_DISTRIBUTION_ID }}
        run: |
          aws cloudfront create-invalidation \
            --distribution-id "$DISTRIBUTION_ID" \
            --paths "/*"
