name: Release Frontend

on:
  push:
    tags:
      - 'v*'

env:
  NODE_VERSION: 24.21.0
  AWS_REGION: eu-central-1
  KEEP: ${{ vars.KEEP || 10 }}

permissions:
  id-token: write
  contents: read

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment: prod

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      # Names and ids are terraform outputs, stored as GitHub variables (guide/configuration.md).
      - name: Check deploy variables
        env:
          AWS_DEPLOY_ROLE_ARN: ${{ vars.AWS_DEPLOY_ROLE_ARN }}
          S3_WEB_CLIENT_BUCKET: ${{ vars.S3_WEB_CLIENT_BUCKET }}
          S3_ASSETS_BUCKET: ${{ vars.S3_ASSETS_BUCKET }}
          CLOUDFRONT_DISTRIBUTION_ID: ${{ vars.CLOUDFRONT_DISTRIBUTION_ID }}
          CLOUDFRONT_URL: ${{ vars.CLOUDFRONT_URL }}
        run: |
          MISSING=""
          for NAME in AWS_DEPLOY_ROLE_ARN S3_WEB_CLIENT_BUCKET S3_ASSETS_BUCKET CLOUDFRONT_DISTRIBUTION_ID CLOUDFRONT_URL; do
            if [ -z "${!NAME}" ]; then
              MISSING="$MISSING $NAME"
            fi
          done

          if [ -n "$MISSING" ]; then
            echo "Missing GitHub variables (set them from terraform output):$MISSING"
            exit 1
          fi

      - name: Setup Node
        uses: actions/setup-node@v6
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build
        run: npm run build:web-client
        env:
          VITE_API_BASE_URL: ${{ vars.VITE_API_BASE_URL }}
          VITE_ASSETS_BASE_URL: ${{ vars.CLOUDFRONT_URL }}/assets
          VITE_SENTRY_DSN: ${{ vars.VITE_SENTRY_DSN }}
          SENTRY_ORG: ${{ vars.SENTRY_ORG }}
          SENTRY_PROJECT: ${{ vars.SENTRY_PROJECT }}
          SENTRY_AUTH_TOKEN: ${{ secrets.SENTRY_AUTH_TOKEN }}

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v6
        with:
          role-to-assume: ${{ vars.AWS_DEPLOY_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Deploy assets
        run: |
          aws s3 sync ./assets \
            s3://${{ vars.S3_ASSETS_BUCKET }}/ \
            --cache-control "max-age=31536000,immutable"

      - name: Deploy versioned archive
        run: |
          aws s3 sync apps/web-client/dist \
            s3://${{ vars.S3_WEB_CLIENT_BUCKET }}/releases/${{ github.ref_name }}/ \
            --exclude "*.map" \
            --delete

      - name: Deploy to root (active version)
        run: |
          aws s3 sync apps/web-client/dist \
            s3://${{ vars.S3_WEB_CLIENT_BUCKET }}/ \
            --exclude "releases/*" \
            --exclude "*.map" \
            --delete \
            --cache-control "max-age=31536000,immutable"
          aws s3 cp apps/web-client/dist/index.html \
            s3://${{ vars.S3_WEB_CLIENT_BUCKET }}/index.html \
            --cache-control "no-cache, no-store, must-revalidate"

      - name: Invalidate CloudFront
        env:
          DISTRIBUTION_ID: ${{ vars.CLOUDFRONT_DISTRIBUTION_ID }}
        run: |
          aws cloudfront create-invalidation \
            --distribution-id "$DISTRIBUTION_ID" \
            --paths "/*"

      - name: Cleanup old versions
        env:
          BUCKET: ${{ vars.S3_WEB_CLIENT_BUCKET }}
        run: |
          VERSIONS=$(aws s3 ls "s3://${BUCKET}/releases/" | awk '/PRE/ {print $2}' | sort -V)
          COUNT=$(echo "$VERSIONS" | grep -c . || true)
          if [ "$COUNT" -gt "$KEEP" ]; then
            echo "$VERSIONS" | head -n $((COUNT - KEEP)) | while read -r v; do
              aws s3 rm "s3://${BUCKET}/releases/${v}" --recursive
            done
          fi
