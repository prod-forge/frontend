<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <!--
      Local-dev fallback. CloudFront serves the same policy as a response header (the enforced source of truth);
      frame-ancestors is honored only there. style-src 'unsafe-inline' stays because Sentry Replay and runtime
      style attributes need it; there is no 'unsafe-eval'. docs/security.md has the details.
    -->
    <meta
      http-equiv="Content-Security-Policy"
      content="default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data: https:; connect-src 'self' %VITE_API_BASE_URL% %VITE_ASSETS_BASE_URL% https://*.sentry.io; font-src 'self' data:; worker-src 'self' blob:; object-src 'none'; base-uri 'self'; frame-ancestors 'none'"
    />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>TodoAI</title>
    <script type="module" src="/src/theme-init.ts"></script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
